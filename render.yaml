# Render Blueprint: https://render.com/docs/blueprint-spec
#
# The web service runs on Render; the database and uploaded images live in
# Supabase (Postgres + Storage), so nothing depends on Render's disk or its
# expiring free database. See README "Hosting" for the Supabase settings.
# Free web services sleep after 15 idle minutes (slow first request).
services:
  - type: web
    name: cerulean
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    # Free instances have no pre-deploy step, so migrations, the admin seed and
    # the lore import (all idempotent) run on boot before the server starts.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase: Connect → Session pooler (port 5432), with the database password.
      - key: DATABASE_URL
        sync: false
      # Supabase: Project Settings → API Keys. Uploads go to the public "media"
      # bucket, created on boot if missing.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      # Only used to create the admin account the first time. Afterwards the
      # password is managed in the app; set ADMIN_RESET_PASSWORD=true for one
      # deploy to force it back to ADMIN_PASSWORD (then remove it).
      - key: ADMIN_PASSWORD
        sync: false
      # Password-reset emails (https://resend.com). Links use RENDER_EXTERNAL_URL
      # automatically; set APP_URL to override (e.g. a custom domain).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
